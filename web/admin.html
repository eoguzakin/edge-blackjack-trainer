<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101812"><meta name="robots" content="noindex,nofollow">
  <title>Manage users — Edge</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23103c33'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-size='49' fill='%23d5f58a'%3E%E2%99%A0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./admin.css"><script type="module" src="./admin.js"></script>
</head>
<body>
  <header><a class="brand" href="./#main">♠ EDGE</a><a class="back-link" href="./#main">Back to table</a></header>
  <main>
    <div class="page-heading"><div><p class="eyebrow">OWNER CONTROLS</p><h1>Manage users</h1></div><span id="owner-name"></span></div>
    <p id="page-status" class="status" role="status">Checking access…</p>
    <section id="admin-gate" hidden></section>
    <div id="admin-workspace" hidden>
      <form id="user-search" class="search-row"><label class="search-label">Find a user<input name="q" type="search" placeholder="Username or account ID" maxlength="64" autocomplete="off"></label><label>Accounts<select name="kind"><option value="all">All accounts</option><option value="registered">Registered</option><option value="guest">Guests</option></select></label><button type="submit">Search</button></form>
      <div class="workspace-grid"><section class="user-browser" aria-label="User accounts"><div id="user-list"></div><div class="pagination"><button id="previous-page" class="quiet" disabled>Previous</button><span id="user-total"></span><button id="next-page" class="quiet" disabled>Next</button></div></section><section id="user-editor" class="user-editor" aria-label="Account details"><p class="empty-state">Choose an account to edit its details.</p></section></div>
    </div>
  </main>
  <noscript>User management needs JavaScript enabled.</noscript>
</body>
</html>
